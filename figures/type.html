<style>
  body { display: flex; align-items: center; justify-content: center; padding: 16px }
  .machine { display: flex; flex-direction: column; align-items: center; width: 100%; max-width: 380px; max-height: 100% }
  /* The sheet: real text in the chosen face, set at true size. */
  .paper { position: relative; width: 82%; flex: 0 1 190px; min-height: 60px; overflow: hidden; padding: 14px 16px 0 30px;
    background: color-mix(in oklab, var(--bg) 90%, var(--fg)); border: 1.5px solid var(--fg); border-bottom: 0; color: var(--fg) }
  .paper p { margin: 0; overflow-wrap: anywhere }
  .guides { position: absolute; inset: 14px 0 0 0; pointer-events: none }
  .size { position: absolute; left: 10px; top: 14px; width: 8px; border: 2px solid; border-right: 0 }
  svg { width: 100%; flex: none; overflow: visible }
</style>
<!--
  Typewriter: a sheet of specimen text in the chosen face. The typewheel stands for the family, the bracket in the
  margin for the size, the line guides on the sheet for the leading, and the ink ribbon thickens with the weight; each
  in the colour of its knob.
-->
<div class="machine" role="img" aria-label="A typewriter with a sheet of specimen text">
  <div class="paper" id="paper">
    <div class="guides" id="guides"></div>
    <div class="size" id="size"></div>
    <p>Hamburgefonstiv</p>
    <p>The quick brown fox jumps over the lazy dog.</p>
    <p>0123456789 &amp; ?! (a/b) — “quote”</p>
  </div>
  <svg id="body" viewBox="0 0 340 128"></svg>
</div>
<script>
  const paper = document.getElementById('paper'), guides = document.getElementById('guides'), size = document.getElementById('size'), body = document.getElementById('body')
  const ink = (name) => bench.lane(name) ? bench.color(name) : 'var(--dim)'
  const line = 'stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none"'

  bench.on(({ family = 'Iowan Old Style', size: px = 18, leading = 1.4, weight = 400 }) => {
    paper.style.font = `${weight} ${px}px/${leading} "${family}", serif`
    // A bracket as tall as the type size, and a guide on every baseline, one leading apart.
    size.style.height = `${px}px`
    size.style.borderColor = ink('size')
    size.style.display = bench.lane('size') ? '' : 'none'
    const pitch = px * leading
    guides.style.background = bench.lane('leading')
      ? `repeating-linear-gradient(to bottom, transparent 0 ${pitch - 1}px, color-mix(in oklab, ${bench.color('leading')} 55%, transparent) ${pitch - 1}px ${pitch}px)`
      : 'none'

    // The machine: platen, typewheel, ribbon, carriage lever, keys.
    const spokes = Array.from({ length: 12 }, (_, i) => {
      const a = (i / 12) * Math.PI * 2
      return `<line x1="${Math.cos(a) * 4}" y1="${Math.sin(a) * 4}" x2="${Math.cos(a) * 13}" y2="${Math.sin(a) * 13}" />`
    }).join('')
    // Heavier type, a thicker ribbon of ink.
    const ribbon = 1 + ((weight - 100) / 800) * 7
    // The carriage lever lifts higher for wider line spacing.
    const lever = -20 - Math.min(1, Math.max(0, (leading - 0.9) / 1.5)) * 45
    const keys = [[10, 26], [9, 41], [8, 56]].map(([count, y], row) => Array.from({ length: count }, (_, i) =>
      `<circle cx="${170 - (count - 1) * 12 + i * 24 + row * 4}" cy="${y + 52}" r="7" />`).join('')).join('')
    body.innerHTML = `
      <g ${line} stroke="var(--fg)">
        <rect x="14" y="0" width="312" height="16" rx="8" />
        <circle cx="8" cy="8" r="6" /><circle cx="332" cy="8" r="6" />
        <path d="M40,22h260l26,96h-312z" />
        <path d="M110,22v8h120v-8" />
        <rect x="120" y="116" width="100" height="0" />
      </g>
      <g ${line} stroke="var(--dim)">${keys}<rect x="110" y="122" width="120" height="0" /><path d="M110,118h120" /></g>
      <g transform="translate(14,8) rotate(${lever})" ${line} stroke="${ink('leading')}"><path d="M0,0h-34" /><circle cx="-38" cy="0" r="4" /></g>
      <g transform="translate(170,46)" ${line} stroke="${ink('family')}"><circle r="15" />${spokes}<circle r="3" /></g>
      <g ${line} stroke="${ink('weight')}">
        <circle cx="96" cy="46" r="11" /><circle cx="244" cy="46" r="11" />
        <path d="M107,46H155M185,46H233" stroke-width="${ribbon}" stroke-linecap="butt" />
      </g>`
  })
</script>
